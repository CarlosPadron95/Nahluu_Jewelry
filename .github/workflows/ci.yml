# ------------------------------------------------------------------
# Integración continua (GitHub Actions)
#
# Se ejecuta en cada push y en cada pull request.
# Si algo falla, el cambio no debe entrar en main.
# ------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si llega un push nuevo, se cancela la ejecución anterior de esa rama
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos: solo leer el código
permissions:
  contents: read

jobs:
  # --- 1. Buscar claves filtradas en todo el historial ---
  secretos:
    name: Claves filtradas (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- 2. Backend: estilo, seguridad y tests con PostgreSQL ---
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Una base de datos PostgreSQL de usar y tirar para los tests
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nahluu_test
          POSTGRES_USER: nahluu
          POSTGRES_PASSWORD: nahluu_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nahluu -d nahluu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Variables solo para la CI (no son secretos reales)
    env:
      DJANGO_SECRET_KEY: clave-solo-para-ci-no-usar-en-produccion-0123456789-abcdefghijklmnop
      DATABASE_URL: postgres://nahluu:nahluu_ci@localhost:5432/nahluu_test
      DJANGO_ALLOWED_HOSTS: localhost

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Instalar dependencias
        run: pip install -r requirements/dev.txt

      - name: Estilo (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Revisión de seguridad de producción
        run: python manage.py check --deploy --fail-level WARNING --settings=config.settings.prod

      - name: Tests (pytest)
        run: pytest

  # --- 3. Frontend: estilo, tipos y compilación ---
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Estilo (ESLint y Prettier)
        run: |
          npm run lint
          npm run format:check

      - name: Tipos (TypeScript)
        run: npm run typecheck

      - name: Compilar para producción
        run: npm run build
