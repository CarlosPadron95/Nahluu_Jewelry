# Dependabot revisa cada semana si hay versiones nuevas de las librerías
# (sobre todo arreglos de seguridad) y abre un pull request para actualizarlas.

version: 2
updates:
  - package-ecosystem: pip
    directory: /backend/requirements
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ["*"]
    ignore:
      # Nos quedamos en Django 5.2 LTS (soporte hasta abril de 2028).
      # Solo aceptamos sus parches (5.2.x), que incluyen los arreglos de seguridad.
      # El salto a la siguiente LTS se hará a mano, con calma.
      - dependency-name: "django"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
        # Las versiones mayores (que pueden romper cosas) llegan por separado
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
